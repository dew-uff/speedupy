version: 2
updates:
  # Python dependencies from uv.lock, minor and patch updates in one pull request.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  # Actions pinned in the workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
