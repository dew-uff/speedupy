name: CI

on:
  push:
  pull_request:

# A newer push to the same branch or pull request makes the running workflow
# obsolete. On `main` every commit keeps its own run: a cancelled run would
# leave a commit without a verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# No job writes to the repository: `coverage` alone gets a write permission, to
# upload its report.
permissions:
  contents: read

defaults:
  run:
    shell: bash

# Every job runs the CPython that uv downloads, never a Python of the runner
# image, so the interpreter does not change when GitHub updates the image.
env:
  UV_MANAGED_PYTHON: "1"

jobs:
  # Cheap checks, in parallel with the suite, so a red here does not hide the
  # result of the tests. Each check runs even when the one before it failed.
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python 3.10
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.10"
          enable-cache: true

      # pyproject.toml changed without `uv lock`: every `uv sync --locked`
      # would fail with a message about the lock, far from the cause.
      - name: Lock is up to date
        run: uv lock --check

      # requirements.txt stays for users; its pins must equal the ones in
      # [project.dependencies] (Task 3).
      - name: Pins of requirements.txt and pyproject.toml agree
        if: ${{ !cancelled() }}
        run: uv run --no-project python .github/scripts/check-pins.py

      # --only-group dev: ruff alone, without the project's dependencies.
      - name: Format check
        if: ${{ !cancelled() }}
        run: uv run --locked --only-group dev ruff format --check .

      - name: Lint
        if: ${{ !cancelled() }}
        run: uv run --locked --only-group dev ruff check .

  test:
    # min-tests: floor for passed + skipped + xfailed + xpassed. Raise it in the
    # pull request that adds tests; lower it only with the reason written in
    # the pull request.
    env:
      MIN_TESTS: 581
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-uv hands python-version to uv, which downloads that CPython even
      # when the image has one (UV_MANAGED_PYTHON, at the top).
      - name: Install uv and Python 3.10
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.10"
          enable-cache: true

      # --locked: install exactly what uv.lock says, and fail instead of
      # re-resolving when the lock and pyproject.toml disagree.
      - name: Install dependencies
        id: sync
        run: uv sync --locked

      # No server runs here: the server tests are deselected (see AGENTS.md).
      # Coverage includes the processes the oracle starts ([tool.coverage.run]
      # in pyproject.toml). It is a report, not a gate: the floor is MIN_TESTS.
      - name: Run tests
        run: |
          set -o pipefail
          uv run --no-sync pytest --cov --cov-report=term --cov-report=xml \
            --cov-report=html | tee pytest.log

      # The count in the job summary, and a failure when the count drops below
      # MIN_TESTS or the log has no summary line: a zero exit status does not
      # prove that the tests ran.
      - name: Record the test count
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: |
          bash .github/scripts/pytest-summary.sh pytest.log "$MIN_TESTS" \
            "ubuntu-latest, 3.10" "uv sync --locked && uv run --no-sync pytest"

      - name: Upload the coverage report
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore

  # The tests that need a server, against the disposable servers of
  # compose.yaml (AGENTS.md, "Running the tests with servers"). They erase data
  # on localhost: that is what the containers are for. A runner has no server
  # on the loopback ports, and compose refuses to start if one is taken.
  test-servers:
    # min-tests: floor for passed + skipped + xfailed + xpassed of the whole
    # run, servers included. Raise it in the pull request that adds tests; lower
    # it only with the reason written in the pull request.
    env:
      MIN_TESTS: 776
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python 3.10
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Install dependencies
        id: sync
        run: uv sync --locked

      # --wait returns when the health checks of the four servers pass.
      - name: Start the servers
        id: servers
        run: docker compose --profile all up -d --wait

      # SPEEDUPY_TEST_SERVERS=1 probes the four servers first and aborts naming
      # the unreachable ones: a missing server is an error, never a skip.
      - name: Run tests
        run: |
          set -o pipefail
          SPEEDUPY_TEST_SERVERS=1 uv run --no-sync pytest | tee pytest.log

      - name: Record the test count
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: |
          bash .github/scripts/pytest-summary.sh pytest.log "$MIN_TESTS" \
            "ubuntu-latest, 3.10, servers" \
            "docker compose --profile all up -d --wait && SPEEDUPY_TEST_SERVERS=1 uv run pytest"

      - name: Server logs
        if: ${{ failure() && steps.servers.outcome != 'skipped' }}
        run: docker compose --profile all logs --no-color > compose.log

      - name: Upload the server logs
        if: ${{ failure() && steps.servers.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-logs
          path: compose.log
          if-no-files-found: ignore

  # The native hashes on the platforms the other jobs do not run: the hash
  # tests against the binaries of native/lib/ (issue #112). The rest of the
  # suite runs on Linux x86_64 only. On arm64, MeowHash has no binary and its
  # tests are skipped, so the count is the same on every platform.
  native-platforms:
    # min-tests: floor for passed + skipped + xfailed + xpassed. Raise it in the
    # pull request that adds hash tests; lower it only with the reason written
    # in the pull request.
    env:
      MIN_TESTS: 133
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, macos-15-intel, macos-15, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python 3.10
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Install dependencies
        id: sync
        run: uv sync --locked

      - name: Run the hash tests
        run: |
          set -o pipefail
          uv run --no-sync pytest test/test_execute_exp/test_services/test_hashes \
            test/test_execute_exp/test_services/test_native_loading.py | tee pytest.log

      - name: Record the test count
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: |
          bash .github/scripts/pytest-summary.sh pytest.log "$MIN_TESTS" \
            "${{ matrix.runner }}, 3.10, native hashes" \
            "uv run pytest test/test_execute_exp/test_services/test_hashes test/test_execute_exp/test_services/test_native_loading.py"

  # Sends the report of `test` to the code quality view of GitHub, which shows
  # it in the pull request, and to qlty.sh, which draws the coverage badge of the
  # README. A report, not a gate: no threshold, and not in the `needs` of
  # `ci-ok`. A job of its own, so QLTY_COVERAGE_TOKEN and the only write
  # permission of the workflow are in no job that runs the project's code. A pull
  # request from a fork gets neither and is skipped; `!cancelled()` and the
  # result check skip the job after a red `test`.
  coverage:
    if: ${{ !cancelled() && needs.test.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: test
    runs-on: ubuntu-latest
    # pull-requests: on a push, the code quality upload looks up the pull request
    # of the branch.
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    steps:
      # qlty reads the commit from git and refuses to upload without a
      # repository.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage

      # fail-on-error and skip-errors: a failed upload (an outage, or the secret
      # missing) does not turn the job red. Only the log of each step proves that
      # its upload happened.
      - name: Upload the coverage to GitHub code quality
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: coverage.xml
          language: Python
          label: code-coverage/pytest-cov
          fail-on-error: false

      # Dependabot's runs get no Actions secret, so there is no token.
      - name: Upload the coverage to qlty.sh
        if: ${{ github.actor != 'dependabot[bot]' }}
        uses: qltysh/qlty-action/coverage@a46e29cfd54065ae8a2c6b1fd3446aed1b1a4257 # v2.8.0
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage.xml
          format: cobertura
          skip-errors: true

  # The one check that the ruleset of `main` requires (Task 7). It fails when
  # any job failed or was cancelled, so adding a job to `needs` is all it takes
  # to make that job blocking.
  ci-ok:
    if: always()
    needs: [checks, test, test-servers, native-platforms]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::checks=${{ needs.checks.result }} test=${{ needs.test.result }} test-servers=${{ needs.test-servers.result }} native-platforms=${{ needs.native-platforms.result }}"
          exit 1
