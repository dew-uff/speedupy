name: Compare with speedupy-native

# One-off check of issue #112: the binaries of native/lib/ against the
# speedupy-native 0.1.0 wheels on PyPI, on each of the five platforms. It
# leaves the repository, with .github/scripts/compare-speedupy-native.py, once
# the result is written in the pull request.
on:
  push:
    branches: [issue_112]
    paths:
      - ".github/workflows/compare-native.yml"
      - ".github/scripts/compare-speedupy-native.py"

permissions:
  contents: read

env:
  UV_MANAGED_PYTHON: "1"

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python 3.10
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.10"

      # speedupy-native has no dependencies; only its wheel is installed.
      - name: Compare
        run: |
          set -o pipefail
          uv run --no-project --with speedupy-native==0.1.0 --no-build \
            python .github/scripts/compare-speedupy-native.py | tee compare.log
          tail -n 1 compare.log >> "$GITHUB_STEP_SUMMARY"
