# Disposable servers for the tests that need one (see AGENTS.md, "Running the
# tests with servers"). The versions are the Dockerfile's, the settings those of
# speedupy_dev_env.sh. Nothing is persisted: every directory the images declare
# as a volume is a tmpfs, so `docker compose down -v` leaves nothing behind.
# Each port is bound to the loopback only, and compose refuses to start when
# one is taken, so a server already on this machine is never reached.
# The code reaches MySQL as 127.0.0.1 and the others as localhost, which may
# resolve to ::1 first; pymemcache tries only that first address. So the
# localhost services are bound to [::1] too.

services:
  mysql:
    image: mysql:9.0.1
    command: ["--max_allowed_packet=1024M"]
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      # The code connects as root from 127.0.0.1, which reaches the container
      # through the port mapping: root must be allowed from any host.
      MYSQL_ROOT_HOST: "%"
    ports:
      - "127.0.0.1:3306:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      # TCP, not the socket: the entrypoint's temporary server listens only on
      # the socket, so a socket ping would pass before the real server is up.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "--silent"]
      interval: 2s
      timeout: 5s
      retries: 60

  mongo:
    image: mongo:6.0.16
    # The container's default soft limit is 1024, and the suite opens more
    # connections than that: mongod then panics with "Too many open files".
    # 64000 is what MongoDB recommends and what its packaged service sets.
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    ports:
      - "127.0.0.1:27017:27017"
      - "[::1]:27017:27017"
    tmpfs:
      - /data/db
      - /data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 60

  redis:
    image: redis:7.4.0
    command: ["redis-server", "--proto-max-bulk-len", "1gb", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
      - "[::1]:6379:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  memcached:
    # The Dockerfile installs Debian bookworm's memcached, version 1.6.18.
    image: memcached:1.6.18
    command: ["memcached", "-m", "4096", "-I", "1024m"]
    ports:
      - "127.0.0.1:11211:11211"
      - "[::1]:11211:11211"
    healthcheck:
      # The image has no client: speak the text protocol through bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/11211 && printf 'version\\r\\n' >&3 && head -c 7 <&3 | grep -q VERSION"]
      interval: 2s
      timeout: 5s
      retries: 30
