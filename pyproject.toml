[project]
name = "speedupy"
version = "1.7.0"
description = "Speeds up scripts by memoizing pure functions with a persistent cache."
readme = "README.md"
# D6: every pin installs from wheels on 3.10 and 3.11 only.
requires-python = ">=3.10,<3.12"
dependencies = [
    "mmh3==4.0.1",
    "numpy==1.26.4",
    "scipy==1.12.0",
    "xxhash==3.4.1",
    "redis==4.3.6",
    "pymongo==4.13.0",
    "pymemcache==4.0.0",
    "mysql-connector-python==9.4.0",
    "cloudpickle==3.1.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-randomly",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
addopts = "--strict-markers -ra"
markers = [
    "mysql: needs the MySQL server on 127.0.0.1:3306 (opt-in, SPEEDUPY_TEST_SERVERS=1)",
    "mongo: needs the MongoDB server on localhost:27017 (opt-in, SPEEDUPY_TEST_SERVERS=1)",
    "redis: needs the Redis server on localhost:6379 (opt-in, SPEEDUPY_TEST_SERVERS=1)",
    "memcached: needs the Memcached server on localhost:11211 (opt-in, SPEEDUPY_TEST_SERVERS=1)",
    "native: needs a native hash library (libmeow.so, liba5hash.so or libmuseair.so)",
]
