[project]
name = "speedupy"
version = "1.7.0"
description = "Speeds up scripts by memoizing pure functions with a persistent cache."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# D10: 3.11 to 3.15. The upper bound stays at what CI runs until the range is
# widened ("Python versions" in AGENTS.md).
requires-python = ">=3.11,<3.12"
dependencies = [
    "mmh3==4.0.1",
    "numpy==1.26.4",
    "scipy==1.15.3",
    "xxhash==4.1.0",
    "redis==8.1.0",
    "pymongo==4.18.3",
    "pymemcache==4.0.0",
    "mysql-connector-python==26.10.0",
    "cloudpickle==3.1.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pandas>=2.2,<2.4",
    "pytest",
    "pytest-cov",
    "pytest-randomly",
    "ruff>=0.17.5",
]
# The tools of the `security` job of CI.
security = [
    "bandit",
    "pip-audit",
]

[tool.ruff]
# The oldest Python the project supports (D10).
target-version = "py311"
# Third-party sources, as their authors wrote them (native/NOTICE).
extend-exclude = ["native/vendor"]

[tool.ruff.lint]
# Blocking rules, as noWorkflow selects them. Line length is the formatter's.
select = ["E4", "E7", "E9", "F", "W605", "B006", "I"]

[tool.ruff.format]
# LF on every platform; .gitattributes does the same for git.
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
addopts = "--strict-markers -ra"
markers = [
    "mysql: needs the MySQL server on 127.0.0.1:3306 (opt-in, SPEEDUPY_TEST_SERVERS=1)",
    "mongo: needs the MongoDB server on localhost:27017 (opt-in, SPEEDUPY_TEST_SERVERS=1)",
    "redis: needs the Redis server on localhost:6379 (opt-in, SPEEDUPY_TEST_SERVERS=1)",
    "memcached: needs the Memcached server on localhost:11211 (opt-in, SPEEDUPY_TEST_SERVERS=1)",
    "native: needs a native hash library of native/lib/ (a5hash, meow or museair)",
]

[tool.coverage.run]
# Report, never a gate: the floor is MIN_TESTS in ci.yml. The oracle starts
# SpeeduPy as child processes, so subprocesses are measured too (each process
# writes its own data file, combined afterwards).
source = ["."]
branch = true
parallel = true
patch = ["subprocess"]
omit = [
    ".venv/*",
    "test/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
